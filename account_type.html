<!DOCTYPE html>
<html>

    <head>

        <link rel="stylesheet" href="assets/css/account_type.css">

    </head>

    <body>
        
        <div class="register-card">

            <h1>Choose Account Type</h1>

            <div class="account-type-card club-card">
                <div class="account-type-logo">
                    <img src="assets/images/coach-icon.png" alt="Coach">
                </div>

                <div class="account-type-info">
                    <h2>Basketball Club/School</h2>
                    <p>
                        Post tryouts, watch player highlights,
                        manage applications, and build your team.
                    </p>
                </div>
            </div>

            <div class="account-type-card player-card">
                <div class="account-type-logo">
                    <img src="assets/images/player-icon.png" alt="Player">
                </div>

                <div class="account-type-info">
                    <h2>Basketball Player</h2>
                    <p>
                        Create your player profile, upload highlight videos,
                        join tryouts, and get discovered by clubs and schools.
                    </p>
                </div>
            </div>

        </div>

    </body>

</html>
