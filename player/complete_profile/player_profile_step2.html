<!DOCTYPE html>
<html>

    <head>

        <link rel="stylesheet" href="../../assets/css/player/complete_player_profile.css">

    </head>

    <body>
        
        <div class="register-card">

            <div class="progress-container">

                <div class="progress-circle active">1</div>
                <div class="progress-line active"></div>

                <div class="progress-circle active">2</div>
                <div class="progress-line"></div>

                <div class="progress-circle">3</div>

            </div>

            <div class="title-container">
                <h1>Complete Your Profile</h1>

                <h3>Basketball Information</h3>
            </div>

            <div class="field-container">
                <div class="form-group">
                    <input type="number" id="height" placeholder="Height">
                    <label for="height">Height (cm)</label>
                </div>

                <div class="form-group">
                    <input type="number" id="weight" placeholder="Weight">
                    <label for="weight">Weight (kg)</label>
                </div>

                <div class="form-group">
                    <select name="primary-position" id="primary-position" required>
                        <option value="" disabled selected hidden></option>
                        <option value="Point Guard">Point Guard</option>
                        <option value="Shooting Guard">Shooting Guard</option>
                        <option value="Small Forward">Small Forward</option>
                        <option value="Power Forward">Power Forward</option>
                        <option value="Center">Center</option>
                    </select>
                    <label for="primary-position">Primary Position</label>
                </div>

                <div class="form-group">
                    <select name="secondary-position" id="secondary-position" required>
                        <option value="" disabled selected hidden></option>
                        <option value="Point Guard">Point Guard</option>
                        <option value="Shooting Guard">Shooting Guard</option>
                        <option value="Small Forward">Small Forward</option>
                        <option value="Power Forward">Power Forward</option>
                        <option value="Center">Center</option>
                    </select>
                    <label for="primary-position">Secondary Position</label>
                </div>

                <div class="form-group">
                    <select name="dominant-hand" id="dominant-hand" required>
                        <option value="" disabled selected hidden></option>
                        <option value="Right Hand">Right Hand</option>
                        <option value="Left Hand">Left Hand</option>
                    </select>
                    <label for="dominant-hand">Dominant Hand</label>
                </div>
            </div>

            <div class="button-container">
                    <button>Next</button>
            </div>
            
        </div>

    </body>

</html>
