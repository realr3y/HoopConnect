<!DOCTYPE html>
<html>

    <head>

        <link rel="stylesheet" href="../../assets/css/player/complete_player_profile.css">

    </head>

    <body>
        
        <div class="register-card">

            <div class="progress-container">

                <div class="progress-circle active">1</div>
                <div class="progress-line active"></div>

                <div class="progress-circle">2</div>
                <div class="progress-line"></div>

                <div class="progress-circle">3</div>

            </div>

            <div class="title-container">
                <h1>Complete Your Profile</h1>

                <h3>Basic Information</h3>
            </div>

            <div class="field-container">
                <div class="form-group">
                    <input type="text" id="first-name" placeholder="First Name">
                    <label for="first-name">First Name</label>
                </div>

                <div class="form-group">
                    <input type="text" id="middle-name" placeholder="Middle Name">
                    <label for="middle-name">Middle Name</label>
                </div>

                <div class="form-group">
                    <input type="text" id="last-name" placeholder="Last Name">
                    <label for="last-name">Last Name</label>
                </div>
                
                <div class="form-group">
                    <input type="date" id="birthday" placeholder="Birthday">
                    <label for="birthday">Birthday</label>
                </div>

                <div class="form-group">
                    <select name="gender" id="gender" required>
                        <option value="" selected disabled></option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                    <label for="gender">Gender</label>
                </div>
                
            </div>

            <div class="button-container">
                    <button>Next</button>
            </div>
            
        </div>

    </body>

</html>
